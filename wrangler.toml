name = "dropafile"
main = "src/api-server/index.ts"
compatibility_date = "2026-07-03"

[durable_objects]
bindings = [{ name = "SESSION_ROOM", class_name = "SessionRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[assets]
not_found_handling = "single-page-application"

run_worker_first = ["/api/*", "/health", "/health/*"]

[env.production]
name = "dropafile"
vars = { ENVIRONMENT = "production" }
# routes = [{ pattern = "example.com/*", custom_domain = true }]

[env.staging]
name = "dropafile-staging"
vars = { ENVIRONMENT = "staging" }
# routes = [{ pattern = "staging.example.com/*", custom_domain = true }]
